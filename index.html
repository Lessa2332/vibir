<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>U-GOV | Чорноморський ліцей №6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --safe-area: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        /* Animated Background Gear */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            z-index: -1;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header UI */
        .u-header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
        }

        .u-logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }

        .u-logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: white;
            padding: 10px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .u-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glass Cards */
        .u-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: cardAppear 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .u-card.active { display: block; }

        /* Video Section Modernized */
        .u-video-box {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 9/16;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        #introVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .u-video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .btn-play {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--text-main);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 20px;
        }

        .btn-play:hover { transform: scale(1.1); }

        .btn-play svg {
            width: 32px;
            height: 32px;
            fill: var(--bg);
            margin-left: 4px;
        }

        /* Survey UI */
        .u-progress-track {
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        .u-progress-fill {
            height: 100%;
            background: var(--grad);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .u-question {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .u-options {
            display: grid;
            gap: 12px;
        }

        .u-option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 18px 24px;
            border-radius: 20px;
            color: var(--text-main);
            text-align: left;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.25s ease;
        }

        .u-option-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .u-option-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent);
            flex-shrink: 0;
        }

        /* Result Visuals */
        .u-result-id {
            text-align: center;
        }

        .u-ministry-icon-box {
            width: 100px;
            height: 100px;
            background: var(--grad);
            border-radius: 30px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .u-ministry-icon-box svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 1.5;
        }

        .u-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent);
            border-radius: 100px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .u-task-grid {
            text-align: left;
            margin-top: 24px;
            display: grid;
            gap: 10px;
        }

        .u-task-item {
            background: rgba(255,255,255,0.03);
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .u-task-item svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent);
            flex-shrink: 0;
        }

        /* Main Button */
        .u-btn-primary {
            background: var(--grad);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .u-btn-primary:active { transform: scale(0.98); }

        .u-skip {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="u-header">
        <div class="u-logo-wrapper">
            <img src="https://i0.wp.com/ilschool6.com/wp-content/uploads/2017/05/school.png" class="u-logo" alt="Ліцей 6">
        </div>

    <div id="card-start" class="u-card">

        <button class="u-btn-primary" onclick="startSurvey()">РОЗПОЧАТИ СИНХРОНІЗАЦІЮ</button>

    <!-- SURVEY CARD -->
    <div id="card-survey" class="u-card">
        <div class="u-progress-track">

        <div id="u-question" class="u-question"></div>
        <div id="u-options" class="u-options"></div>
    </div>

    <!-- RESULT CARD -->
    <div id="card-result" class="u-card u-result-id">
        <div class="u-badge">Analysis Complete</div>
        <div class="u-ministry-icon-box" id="res-icon-box">

        </div>
        <h2 id="res-name" style="font-size: 24px; margin-bottom: 12px;"></h2>
        <p id="res-desc" style="color: var(--text-dim); font-size: 14px; margin-bottom: 24px; padding: 0 10px;"></p>
        
        <div class="u-task-grid" id="res-tasks">
            <!-- Tasks will be injected here -->
        </div>

        <button class="u-btn-primary" onclick="location.reload()">ПЕРЕЗАВАНТАЖИТИ</button>
    </div>
</div>

            cult: { name: "Creative Studio", icon: ICONS.cult, desc: "Ти — генератор ідей. Твоя креативність перетворює звичайне шкільне життя на нескінченний фестиваль талантів.", tasks: ["Організація масштабних івентів", "Дизайн та арт-проєкти", "Розвиток творчих ком'юніті"] },
            sport: { name: "Active Force", icon: ICONS.sport, desc: "Ти — джерело енергії. Твій драйв та прагнення до перемог надихають ліцеїстів на активний спосіб життя.", tasks: ["Спортивні ліги та турніри", "Челенджі здорового способу життя", "Організація активного відпочинку"] },
            info: { name: "Media Pulse", icon: ICONS.info, desc: "Ти — медіа-експерт. Твоє вміння ловити хайп та поширювати важливе робить ліцей найпомітнішим у мережі.", tasks: ["Контент-мейкінг та SMM", "Шкільне радіо та подкасти", "Зв'язки з громадськістю"] }
        }
    };

    let step = 0;
    let scores = { edu: 0, disc: 0, cult: 0, sport: 0, info: 0 };
    const video = document.getElementById('introVideo');

    function playIntro() {
        document.getElementById('videoOverlay').style.display = 'none';
        video.play();
        video.onended = toStart;
    }

    function toStart() {
        video.pause();
        document.getElementById('card-video').classList.remove('active');
        document.getElementById('card-start').classList.add('active');
    }

    function startSurvey() {
        document.getElementById('card-start').classList.remove('active');
        document.getElementById('card-survey').classList.add('active');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = surveyData.questions[step];
        const total = surveyData.questions.length;
        
        document.getElementById('u-bar').style.width = `${(step / total) * 100}%`;
        document.getElementById('u-counter').innerText = `Question ${String(step + 1).padStart(2, '0')}`;
        document.getElementById('u-question').innerText = qData.q;
        
        const optionsBox = document.getElementById('u-options');
        optionsBox.innerHTML = '';
        
        qData.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'u-option-btn';
            btn.innerHTML = `${opt.i} <span>${opt.t}</span>`;
            btn.onclick = () => {
                for (let s in opt.s) scores[s] += opt.s[s];
                step++;
                if (step < total) renderQuestion(); else showResult();
            };
            optionsBox.appendChild(btn);
        });
    }

    function showResult() {
        document.getElementById('card-survey').classList.remove('active');
        document.getElementById('card-result').classList.add('active');

        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        const min = surveyData.ministries[winner];

        document.getElementById('res-icon-box').innerHTML = min.icon;
        document.getElementById('res-name').innerText = min.name;
        document.getElementById('res-desc').innerText = min.desc;

        const taskBox = document.getElementById('res-tasks');
        taskBox.innerHTML = '';
        min.tasks.forEach(t => {
            taskBox.innerHTML += `<div class="u-task-item">${ICONS.arrow} ${t}</div>`;
        });
    }
</script>

</body>
</html>
